
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b66">
  <title>Student Quiz Challenge | Atta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f4fa;
      color: #172b4d;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      color: #173b66;
      text-align: center;
    }

    h2 {
      color: #173b66;
    }

    p {
      line-height: 1.6;
    }

    select, button {
      padding: 13px;
      font-size: 16px;
      border-radius: 8px;
    }

    select {
      width: 100%;
      margin: 10px 0 20px;
      border: 1px solid #aaa;
      background: white;
    }

    button {
      border: none;
      background: #1769cc;
      color: white;
      cursor: pointer;
      margin: 5px 0;
    }

    button:hover {
      background: #104e99;
    }

    button:disabled {
      cursor: default;
      opacity: 0.8;
    }

    #start, #again, #next {
      width: 100%;
    }

    #answers {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    #answers button {
      width: 100%;
      text-align: left;
      padding: 15px;
      background: #edf3fc;
      color: #173b66;
      border: 2px solid #d1e0f5;
    }

    #answers button.correct {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }

    #answers button.wrong {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }

    #feedback {
      font-weight: bold;
      margin-top: 15px;
    }

    #progress {
      color: #666;
      font-size: 14px;
    }

    #results {
      text-align: center;
    }

    #score {
      font-size: 22px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      color: #1769cc;
      text-decoration: none;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="container">

    <a class="back" href="./index.html">
      ← Back to Study Planner
    </a>

    <h1>Student Quiz Challenge</h1>

    <p>
      Test your knowledge with five multiple-choice
      questions from the Open Trivia Database API!
    </p>

    <label for="category">Choose a category:</label>

    <select id="category">
      <option value="9">General Knowledge</option>
      <option value="17">Science & Nature</option>
      <option value="18">Computers</option>
      <option value="19">Mathematics</option>
      <option value="21">Sports</option>
      <option value="23">History</option>
    </select>

    <button id="start" type="button">
      Start Quiz
    </button>

    <p id="status" role="status">
      Select a category and start!
    </p>

    <section id="quiz" hidden>
      <p id="progress"></p>

      <h2 id="question"></h2>

      <div id="answers"></div>

      <p id="feedback" aria-live="polite"></p>

      <button id="next" type="button" hidden>
        Next Question
      </button>
    </section>

    <section id="results" hidden>
      <h2>Quiz Completed!</h2>

      <p id="score"></p>

      <button id="again" type="button">
        Play Again
      </button>
    </section>

  </main>

  <script>
    const $ = id => document.getElementById(id);

    let questions = [];
    let position = 0;
    let correctCount = 0;
    let answered = false;

    function decodeHTML(value) {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = value;
      return textarea.value;
    }

    function shuffle(items) {
      const copy = [...items];

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    async function startQuiz() {
      $('start').disabled = true;
      $('status').textContent = 'Loading questions...';

      $('quiz').hidden = true;
      $('results').hidden = true;

      try {
        const category = $('category').value;

        const url =
          `https://opentdb.com/api.php?amount=5&category=${category}&type=multiple`;

        const response = await fetch(url, {
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error('Network error');
        }

        const data = await response.json();

        if (
          data.response_code !== 0 ||
          !Array.isArray(data.results) ||
          data.results.length === 0
        ) {
          throw new Error('No questions available');
        }

        questions = data.results.map(q => ({
          question: decodeHTML(q.question),
          correct: decodeHTML(q.correct_answer),
          options: shuffle(
            [...q.incorrect_answers, q.correct_answer]
              .map(decodeHTML)
          )
        }));

        position = 0;
        correctCount = 0;
        answered = false;

        $('status').textContent = 'Quiz ready!';

        showQuestion();

      } catch (error) {
        $('status').textContent =
          'Could not load questions. Check your internet connection and try again in a few seconds.';
      } finally {
        $('start').disabled = false;
      }
    }

    function showQuestion() {
      answered = false;

      const q = questions[position];

      $('quiz').hidden = false;
      $('results').hidden = true;

      $('progress').textContent =
        `Question ${position + 1} of ${questions.length} | Score: ${correctCount}`;

      $('question').textContent = q.question;
      $('feedback').textContent = '';

      $('next').hidden = true;
      $('answers').replaceChildren();

      q.options.forEach(option => {
        const button = document.createElement('button');

        button.type = 'button';
        button.textContent = option;

        button.addEventListener('click', () => {
          chooseAnswer(option);
        });

        $('answers').append(button);
      });
    }

    function chooseAnswer(selected) {
      if (answered) return;

      answered = true;

      const q = questions[position];

      if (selected === q.correct) {
        correctCount++;
      }

      for (const button of $('answers').children) {
        button.disabled = true;

        if (button.textContent === q.correct) {
          button.classList.add('correct');
        } else if (button.textContent === selected) {
          button.classList.add('wrong');
        }
      }

      if (selected === q.correct) {
        $('feedback').textContent = 'Correct! 🎉';
      } else {
        $('feedback').textContent =
          `Not quite. Correct answer: ${q.correct}`;
      }

      $('next').textContent =
        position === questions.length - 1
          ? 'See Results'
          : 'Next Question';

      $('next').hidden = false;
    }

    $('start').addEventListener('click', startQuiz);

    $('again').addEventListener('click', startQuiz);

    $('next').addEventListener('click', () => {
      position++;

      if (position < questions.length) {
        showQuestion();
      } else {
        $('quiz').hidden = true;
        $('results').hidden = false;

        $('score').textContent =
          `You got ${correctCount} out of ${questions.length} correct!`;

        $('status').textContent = 'Finished!';
      }
    });
  </script>
</body>
</html>
